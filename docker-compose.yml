version: "3"
services:
  frontend:
    build:
      context: ./frontend # Passe den Pfad zum React-App-Verzeichnis an
      dockerfile: Dockerfile
    ports:
      - 3000:3000 # Passe den gewünschten Port an
    depends_on:
      - backend
  backend:
    build:
      context: ./backend # Passe den Pfad zum Flask-Projektverzeichnis an
      dockerfile: Dockerfile
    ports:
      - 5000:5000 # Passe den gewünschten Port an
